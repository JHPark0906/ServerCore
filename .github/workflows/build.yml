name: Windows and Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: ${{ matrix.os }} ${{ matrix.configuration }} native-${{ matrix.linkage }}
    strategy:
      fail-fast: false
      matrix:
        # Preserve all four static jobs. Two single-library shared jobs exercise
        # the C++ and C APIs on both OS loaders without doubling every build path.
        include:
          - { os: ubuntu-24.04, configuration: Debug, linkage: static, shared: "OFF" }
          - { os: ubuntu-24.04, configuration: Release, linkage: static, shared: "OFF" }
          - { os: windows-2022, configuration: Debug, linkage: static, shared: "OFF" }
          - { os: windows-2022, configuration: Release, linkage: static, shared: "OFF" }
          - { os: ubuntu-24.04, configuration: Release, linkage: shared, shared: "ON" }
          - { os: windows-2022, configuration: Debug, linkage: shared, shared: "ON" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++23 and required standard library capabilities
        run: >-
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DSERVERCORE_BUILD_SHARED=${{ matrix.shared }}
          -DSERVERCORE_BUILD_TESTS=ON -DSERVERCORE_BUILD_C_API=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.configuration }} --parallel 4
      - name: Test including source and installed package consumers
        run: ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure --no-tests=error --parallel 4

  rust-source-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build native component through Cargo and test wrappers
        working-directory: rust
        run: cargo test --workspace --all-targets --locked --offline

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's GCC/libstdc++ pair provides both required C++23 library types.
      # Clang 18 with libstdc++ 13 hides expected behind its concepts feature guard.
      - name: Configure GCC with ASan and UBSan
        run: >-
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DSERVERCORE_BUILD_SHARED=OFF
          -DSERVERCORE_BUILD_C_API=ON
      - name: Build
        run: cmake --build build/sanitizers --parallel 4
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure --no-tests=error --parallel 4 -E CMake
